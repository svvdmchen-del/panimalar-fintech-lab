# Firebase App Hosting configuration
# Documentation: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Resource allocation for Next.js SSR & API routes
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 5
  concurrency: 80

env:
  - variable: NODE_ENV
    value: production
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
